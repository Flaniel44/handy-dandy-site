<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" id="scheduled-coffee-root">
  <title>Scheduled coffee maker button automation</title>
  <desc>A clock reaches seven in the morning, sends a signal to a button pusher, and starts an ordinary coffee maker.</desc>

  <defs>
    <clipPath id="coffee-scene-clip">
      <rect width="600" height="500" />
    </clipPath>
    <clipPath id="carafe-clip">
      <path d="M400 292 H478 L493 379 Q494 389 484 389 H393 Q383 389 386 379 Z" />
    </clipPath>
    <linearGradient id="coffee-window-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17213A" />
      <stop offset="100%" stop-color="#C76755" />
    </linearGradient>
    <linearGradient id="coffee-maker-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#607D8B" />
      <stop offset="55%" stop-color="#455A64" />
      <stop offset="100%" stop-color="#263238" />
    </linearGradient>
    <linearGradient id="fresh-coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D5A38" />
      <stop offset="45%" stop-color="#5D321F" />
      <stop offset="100%" stop-color="#24120D" />
    </linearGradient>
    <radialGradient id="coffee-warmth" cx="68%" cy="62%" r="50%">
      <stop offset="0%" stop-color="#FFB74D" stop-opacity=".42" />
      <stop offset="55%" stop-color="#F57C00" stop-opacity=".16" />
      <stop offset="100%" stop-color="#F57C00" stop-opacity="0" />
    </radialGradient>
    <filter id="coffee-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity=".42" />
    </filter>
    <filter id="coffee-soft-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity=".32" />
    </filter>
    <filter id="schedule-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="power-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FFB74D" flood-opacity=".95" />
    </filter>

    <path id="segment-a" d="M3 0 H15 L18 3 L15 6 H3 L0 3 Z" />
    <path id="segment-b" d="M15 4 L18 7 V15 L15 18 L12 15 V7 Z" />
    <path id="segment-c" d="M15 19 L18 22 V30 L15 33 L12 30 V22 Z" />
    <path id="segment-d" d="M3 31 H15 L18 34 L15 37 H3 L0 34 Z" />
    <path id="segment-e" d="M3 19 L6 22 V30 L3 33 L0 30 V22 Z" />
    <path id="segment-f" d="M3 4 L6 7 V15 L3 18 L0 15 V7 Z" />
    <path id="segment-g" d="M3 15 H15 L18 18 L15 21 H3 L0 18 Z" />

    <g id="digit-zero">
      <use href="#segment-a" /><use href="#segment-b" /><use href="#segment-c" />
      <use href="#segment-d" /><use href="#segment-e" /><use href="#segment-f" />
    </g>
    <g id="digit-five">
      <use href="#segment-a" /><use href="#segment-f" /><use href="#segment-g" />
      <use href="#segment-c" /><use href="#segment-d" />
    </g>
    <g id="digit-six">
      <use href="#segment-a" /><use href="#segment-f" /><use href="#segment-g" />
      <use href="#segment-e" /><use href="#segment-c" /><use href="#segment-d" />
    </g>
    <g id="digit-seven">
      <use href="#segment-a" /><use href="#segment-b" /><use href="#segment-c" />
    </g>
    <g id="digit-nine">
      <use href="#segment-a" /><use href="#segment-b" /><use href="#segment-c" />
      <use href="#segment-d" /><use href="#segment-f" /><use href="#segment-g" />
    </g>
  </defs>

  <style>
    #coffee-room-warmth {
      animation: coffee-room-warmth 10s ease-in-out infinite;
    }
    @keyframes coffee-room-warmth {
      0%, 43% { opacity: 0; }
      50%, 88% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }

    #clock-659 {
      animation: clock-before 10s linear infinite;
    }
    @keyframes clock-before {
      0%, 18% { opacity: 1; }
      21%, 96% { opacity: 0; }
      100% { opacity: 1; }
    }

    #clock-700 {
      animation: clock-after 10s linear infinite;
    }
    @keyframes clock-after {
      0%, 18% { opacity: 0; }
      21%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }

    #clock-colon {
      animation: clock-blink 1s steps(1, end) infinite;
    }
    @keyframes clock-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: .25; }
    }

    #schedule-path-active {
      animation: schedule-path-flash 10s ease-in-out infinite;
    }
    @keyframes schedule-path-flash {
      0%, 20% { opacity: 0; }
      23%, 42% { opacity: .46; }
      47%, 100% { opacity: 0; }
    }

    #schedule-pulse {
      animation: schedule-pulse-travel 10s linear infinite;
      transform-origin: 0 0;
    }
    @keyframes schedule-pulse-travel {
      0%, 21% { opacity: 0; transform: translate(376px, 101px); }
      23% { opacity: 1; transform: translate(376px, 101px); }
      29% { opacity: 1; transform: translate(309px, 101px); }
      30% { opacity: 1; transform: translate(309px, 101px) rotate(-90deg); }
      43% { opacity: 1; transform: translate(309px, 267px) rotate(-90deg); }
      45%, 100% { opacity: 0; transform: translate(309px, 267px) rotate(-90deg); }
    }

    #pusher-signal {
      animation: pusher-signal 10s linear infinite;
    }
    @keyframes pusher-signal {
      0%, 41% { fill: #263238; filter: none; }
      43%, 51% { fill: #00E5FF; filter: url(#schedule-glow); }
      54%, 100% { fill: #263238; filter: none; }
    }

    #pusher-arm {
      animation: pusher-press 10s cubic-bezier(.35, 0, .2, 1) infinite;
    }
    @keyframes pusher-press {
      0%, 44% { transform: translateX(0); }
      47%, 50% { transform: translateX(20px); }
      54%, 100% { transform: translateX(0); }
    }

    #maker-button {
      animation: maker-button-press 10s ease-in-out infinite;
    }
    @keyframes maker-button-press {
      0%, 45% { transform: translateX(0); }
      47%, 50% { transform: translateX(3px); }
      53%, 100% { transform: translateX(0); }
    }

    #maker-power-light {
      animation: maker-power-on 10s linear infinite;
    }
    @keyframes maker-power-on {
      0%, 47% { fill: #37474F; filter: none; }
      50%, 92% { fill: #FFB74D; filter: url(#power-glow); }
      98%, 100% { fill: #37474F; filter: none; }
    }

    #brew-stream {
      animation: brew-stream 10s ease-in-out infinite;
      transform-origin: 433px 294px;
    }
    @keyframes brew-stream {
      0%, 51% { opacity: 0; transform: scaleY(0); }
      54%, 76% { opacity: 1; transform: scaleY(1); }
      80%, 100% { opacity: 0; transform: scaleY(.2); }
    }

    #coffee-fill {
      animation: coffee-fill 10s cubic-bezier(.25, .8, .25, 1) infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    @keyframes coffee-fill {
      0%, 52% { transform: scaleY(.05); }
      78%, 94% { transform: scaleY(1); }
      100% { transform: scaleY(.05); }
    }

    .coffee-steam {
      stroke-dasharray: 22 18;
      animation: coffee-steam 10s ease-in-out infinite;
    }
    .coffee-steam.steam-two {
      animation-delay: -.45s;
    }
    .coffee-steam.steam-three {
      animation-delay: -.9s;
    }
    @keyframes coffee-steam {
      0%, 65% { opacity: 0; stroke-dashoffset: 0; transform: translateY(8px); }
      72% { opacity: .78; }
      88% { opacity: .55; stroke-dashoffset: 38; transform: translateY(-7px); }
      96%, 100% { opacity: 0; stroke-dashoffset: 55; transform: translateY(-15px); }
    }

    #ready-check {
      animation: ready-check 10s cubic-bezier(.2, .8, .2, 1) infinite;
      transform-origin: 522px 119px;
    }
    @keyframes ready-check {
      0%, 76% { opacity: 0; transform: scale(.5); }
      80%, 91% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(.5); }
    }
  </style>

  <g clip-path="url(#coffee-scene-clip)">
    <rect width="600" height="350" fill="#2E3B42" />
    <rect y="350" width="600" height="150" fill="#1C1C1C" />
    <rect y="342" width="600" height="10" fill="#263238" />

    <g id="window" filter="url(#coffee-soft-shadow)">
      <rect x="34" y="42" width="172" height="190" rx="4" fill="url(#coffee-window-sky)" />
      <circle cx="168" cy="182" r="23" fill="#FFCC80" opacity=".82" />
      <polygon points="34,202 87,159 126,190 170,151 206,182 206,232 34,232" fill="#263F46" />
      <rect x="30" y="38" width="180" height="198" rx="5" fill="none" stroke="#CFD8DC" stroke-width="7" />
      <line x1="120" y1="42" x2="120" y2="232" stroke="#CFD8DC" stroke-width="5" />
    </g>

    <rect id="coffee-room-warmth" width="600" height="500" fill="url(#coffee-warmth)" opacity="0" pointer-events="none" />

    <g id="digital-clock" transform="translate(376 72)" filter="url(#coffee-shadow)">
      <rect width="104" height="58" rx="10" fill="#172126" stroke="#455A64" stroke-width="3" />
      <rect x="7" y="8" width="90" height="42" rx="6" fill="#081113" />
      <g fill="#00E5FF" filter="url(#schedule-glow)" transform="translate(11 11) scale(.82)">
        <g id="clock-659">
          <use href="#digit-six" />
          <use href="#digit-five" transform="translate(51 0)" />
          <use href="#digit-nine" transform="translate(75 0)" />
        </g>
        <g id="clock-700" opacity="0">
          <use href="#digit-seven" />
          <use href="#digit-zero" transform="translate(51 0)" />
          <use href="#digit-zero" transform="translate(75 0)" />
        </g>
        <g id="clock-colon">
          <circle cx="39" cy="12" r="2.5" />
          <circle cx="39" cy="25" r="2.5" />
        </g>
      </g>
      <text x="86" y="45" fill="#90A4AE" font-family="sans-serif" font-size="7" font-weight="700">AM</text>
    </g>

    <path d="M376 101 H309 V267" fill="none" stroke="#1C3038" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path id="schedule-path-active" d="M376 101 H309 V267" fill="none" stroke="#00B8D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <g id="schedule-pulse" opacity="0" filter="url(#schedule-glow)">
      <rect x="-8" y="-4" width="16" height="8" rx="3" fill="#80F4FF" />
    </g>

    <g id="counter" filter="url(#coffee-soft-shadow)">
      <rect x="18" y="390" width="564" height="28" rx="3" fill="#455A64" />
      <polygon points="10,383 590,383 578,402 22,402" fill="#607D8B" />
      <rect x="34" y="418" width="532" height="82" fill="#263238" />
      <rect x="294" y="422" width="4" height="78" fill="#1B2529" />
      <circle cx="278" cy="454" r="4" fill="#78909C" />
      <circle cx="314" cy="454" r="4" fill="#78909C" />
    </g>

    <g id="coffee-maker" filter="url(#coffee-shadow)">
      <rect x="340" y="158" width="176" height="232" rx="16" fill="url(#coffee-maker-body)" />
      <rect x="354" y="174" width="148" height="70" rx="10" fill="#263238" />
      <rect x="367" y="187" width="91" height="13" rx="5" fill="#172126" />
      <circle id="maker-power-light" cx="482" cy="194" r="5" fill="#37474F" />
      <rect x="381" y="232" width="116" height="70" rx="8" fill="#1D292E" />
      <rect x="409" y="246" width="56" height="18" rx="6" fill="#37474F" />
      <path d="M420 264 H454 L449 292 H425 Z" fill="#1A2225" />
      <rect x="427" y="286" width="13" height="14" rx="5" fill="#3E2723" />

      <g id="carafe">
        <path d="M400 292 H478 L493 379 Q494 389 484 389 H393 Q383 389 386 379 Z" fill="#B0BEC5" opacity=".24" stroke="#90A4AE" stroke-width="4" />
        <g clip-path="url(#carafe-clip)">
          <rect id="coffee-fill" x="384" y="315" width="112" height="76" fill="url(#fresh-coffee)" />
          <path d="M386 323 Q440 314 493 323" fill="none" stroke="#B77A50" stroke-width="4" opacity=".65" />
        </g>
        <path d="M479 312 Q521 308 518 346 Q516 372 488 367" fill="none" stroke="#263238" stroke-width="12" stroke-linecap="round" />
        <rect x="394" y="286" width="92" height="13" rx="5" fill="#263238" />
      </g>

      <rect x="376" y="384" width="128" height="8" rx="4" fill="#172126" />
    </g>

    <g id="button-pusher" transform="translate(278 248)" filter="url(#coffee-soft-shadow)">
      <rect x="0" y="0" width="58" height="46" rx="12" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="3" />
      <rect x="8" y="8" width="30" height="30" rx="8" fill="#CFD8DC" />
      <circle id="pusher-signal" cx="23" cy="23" r="5" fill="#263238" />
      <g id="pusher-arm">
        <rect x="36" y="17" width="34" height="12" rx="6" fill="#78909C" />
        <circle cx="67" cy="23" r="8" fill="#455A64" />
      </g>
    </g>

    <g id="maker-button">
      <rect x="346" y="263" width="10" height="24" rx="4" fill="#172126" />
      <circle cx="351" cy="275" r="3" fill="#78909C" />
    </g>

    <rect id="brew-stream" x="429" y="288" width="8" height="42" rx="4" fill="#6D3B24" opacity="0" />

    <g fill="none" stroke="#ECEFF1" stroke-width="4" stroke-linecap="round">
      <path class="coffee-steam steam-one" d="M414 309 C400 294 423 282 410 265" opacity="0" />
      <path class="coffee-steam steam-two" d="M440 304 C428 286 452 276 440 258" opacity="0" />
      <path class="coffee-steam steam-three" d="M466 309 C452 292 476 280 464 263" opacity="0" />
    </g>

    <g id="ready-check" opacity="0" filter="url(#schedule-glow)">
      <circle cx="522" cy="119" r="28" fill="#10272A" stroke="#00E676" stroke-width="3" />
      <path d="M508 119 L518 129 L537 108" fill="none" stroke="#00E676" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
