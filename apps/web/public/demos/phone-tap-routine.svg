<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" overflow="hidden" id="smart-home-cinema-root">
  <defs>
    <!-- Drop Shadow Filters -->
    <filter id="shadow-deep" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="shadow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Intense Ambient Glow Diffusion Filter -->
    <filter id="glow-spread" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- TV Screen Max Luminance Bloom Filter -->
    <filter id="tv-screen-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- UI Neon Glow Filter -->
    <filter id="ui-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="1" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00E5FF" flood-opacity="0.9" />
    </filter>
    <filter id="phone-check-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#29B6F6" flood-opacity="0.75" />
    </filter>

    <!-- High-Intensity Backlight Radial Glow -->
    <radialGradient id="tv-backlight-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="1" />
      <stop offset="60%" stop-color="#00B0FF" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#00B0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Window Clip Path -->
    <clipPath id="window-clip">
      <rect x="66" y="46" width="168" height="188" rx="2" />
    </clipPath>

    <!-- Hard scene boundary for filter and glow output -->
    <clipPath id="scene-clip">
      <rect x="0" y="0" width="600" height="500" />
    </clipPath>

    <!-- Max Luminance Vibrant Neon TV Screen Gradient -->
    <linearGradient id="tv-screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#A6F3FF" />
      <stop offset="55%" stop-color="#00E5FF" />
      <stop offset="85%" stop-color="#B537FF" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <!-- Central White Hot Core Gradient -->
    <radialGradient id="screen-hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <!-- Phone Screen Glow Gradient -->
    <radialGradient id="phone-glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00E676" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* --- ANIMATION SEQUENCING (8s Loop) --- */
    #ambient-light-overlay { animation: room-dimming 8s linear infinite; }
    @keyframes room-dimming {
      0%, 56% { opacity: 0; }        
      61%, 96% { opacity: 0.75; }   
      100% { opacity: 0; }     
    }

    #curtain-panel-left { animation: curtain-close-left 8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes curtain-close-left {
      0%, 56% { transform: translateX(0px); }       
      62%, 96% { transform: translateX(65px); }     
      100% { transform: translateX(0px); }          
    }

    #curtain-panel-right { animation: curtain-close-right 8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes curtain-close-right {
      0%, 56% { transform: translateX(0px); }       
      62%, 96% { transform: translateX(-65px); }    
      100% { transform: translateX(0px); }          
    }

    #tv-screen-content, #tv-glow-halo, #console-reflection { animation: tv-power 8s linear infinite; }
    @keyframes tv-power {
      0%, 58% { opacity: 0; }       
      63%, 96% { opacity: 1; }      
      98%, 100% { opacity: 0; }     
    }

    #first-person-arm {
      animation: phone-tap-motion 8s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      transform-origin: 300px 500px;
    }
    @keyframes phone-tap-motion {
      0%, 44% { transform: translate(0px, 45px) scale(1) rotate(0deg); }
      48% { transform: translate(-132px, 235px) scale(1) rotate(0deg); }
      52%, 84% { transform: translate(0px, 45px) scale(1) rotate(0deg); }
      88% { transform: translate(-132px, 235px) scale(1) rotate(0deg); }
      92%, 100% { transform: translate(0px, 45px) scale(1) rotate(0deg); }
    }

    #phone-tap-light { animation: phone-tap-light-flash 8s linear infinite; }
    @keyframes phone-tap-light-flash {
      0%, 46% { opacity: 0; }
      48%, 60.5% { opacity: 1; }
      62.5%, 86% { opacity: 0; }
      88%, 100% { opacity: 1; }
    }

    #phone-checkmark {
      animation: phone-checkmark-pop 8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      transform-origin: 42.5px 80px;
    }
    @keyframes phone-checkmark-pop {
      0%, 49% { opacity: 0; transform: scale(0.72); }
      51%, 60.5% { opacity: 1; transform: scale(1); }
      62.5%, 89% { opacity: 0; transform: scale(0.72); }
      91%, 99% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.72); }
    }

    #mdi-switch-indicator { animation: switch-glow 8s linear infinite; }
    @keyframes switch-glow {
      0%, 46% { fill: #37474F; filter: none; }
      48%, 58% { fill: #00E676; filter: drop-shadow(0 0 10px #00E676); }
      60%, 86% { fill: #29B6F6; filter: drop-shadow(0 0 4px #29B6F6); }
      88%, 98% { fill: #00E676; filter: drop-shadow(0 0 10px #00E676); }
      100% { fill: #37474F; filter: none; }
    }
  </style>

  <g clip-path="url(#scene-clip)">
  <!-- === BACKGROUND: LIVING ROOM WALL &amp; WINDOW === -->
  <rect id="bg-wall" width="600" height="360" fill="#37474F" />
  <rect id="bg-floor" x="0" y="360" width="600" height="140" fill="#212121" />
  <rect id="baseboard" x="0" y="350" width="600" height="10" fill="#263238" />

  <!-- Outdoor Window / Day View -->
  <g id="window-group">
    <rect x="70" y="50" width="160" height="180" fill="#90CAF9" rx="4" />
    <circle cx="180" cy="90" r="24" fill="#FFF59D" />
    <polygon points="70,200 130,150 180,180 230,140 230,230 70,230" fill="#81C784" />
    <rect x="66" y="46" width="168" height="188" rx="4" fill="none" stroke="#ECEFF1" stroke-width="6" />
    <line x1="150" y1="50" x2="150" y2="230" stroke="#ECEFF1" stroke-width="4" />
  </g>

  <!-- === CURTAINS === -->
  <g id="curtains-container" clip-path="url(#window-clip)">
    <g id="curtain-panel-left">
      <rect x="0" y="46" width="88" height="188" fill="#C62828" />
      <rect x="12" y="46" width="10" height="188" fill="#E53935" />
      <rect x="30" y="46" width="10" height="188" fill="#B71C1C" />
      <rect x="48" y="46" width="10" height="188" fill="#D32F2F" />
      <rect x="66" y="46" width="10" height="188" fill="#B71C1C" />
    </g>
    <g id="curtain-panel-right">
      <rect x="212" y="46" width="88" height="188" fill="#C62828" />
      <rect x="224" y="46" width="10" height="188" fill="#B71C1C" />
      <rect x="242" y="46" width="10" height="188" fill="#D32F2F" />
      <rect x="260" y="46" width="10" height="188" fill="#B71C1C" />
      <rect x="278" y="46" width="10" height="188" fill="#E53935" />
    </g>
  </g>

  <rect x="55" y="38" width="190" height="8" rx="3" fill="#B0BEC5" filter="url(#shadow-soft)" />
  <circle cx="60" cy="42" r="5" fill="#78909C" />
  <circle cx="240" cy="42" r="5" fill="#78909C" />

  <!-- === AMBIENT LIGHT OVERLAY (behind the powered TV) === -->
  <rect id="ambient-light-overlay" width="600" height="500" fill="#0A0E1A" opacity="0" style="mix-blend-mode: multiply; pointer-events: none;" />

  <!-- === SMART TV &amp; CONSOLE TABLE === -->
  <g id="tv-area" transform="translate(0, 115)">
  <ellipse id="tv-glow-halo" cx="410" cy="120" rx="220" ry="140" fill="url(#tv-backlight-glow)" opacity="0" filter="url(#glow-spread)" />

  <g id="tv-unit" filter="url(#shadow-deep)">
    <rect x="300" y="60" width="220" height="120" rx="6" fill="#101010" stroke="#212121" stroke-width="4" />
    <rect x="395" y="180" width="30" height="15" fill="#424242" />
    <polygon points="370,195 450,195 460,200 360,200" fill="#212121" />

    <rect x="306" y="66" width="208" height="108" fill="#1C2526" />

    <g id="tv-screen-content" opacity="0" filter="url(#tv-screen-bloom)">
      <rect x="306" y="66" width="208" height="108" fill="url(#tv-screen-grad)" />
      <ellipse cx="410" cy="120" rx="90" ry="50" fill="url(#screen-hotspot)" />
      <rect x="306" y="66" width="208" height="108" fill="#FFFFFF" opacity="0.58" />
      
      <g filter="url(#ui-glow)">
        <circle cx="410" cy="120" r="28" fill="#FFFFFF" opacity="0.6" />
        <circle cx="410" cy="120" r="20" fill="#FFFFFF" />
        <polygon points="404,109 423,120 404,131" fill="#0021A5" />
        <rect x="320" y="154" width="180" height="5" rx="2.5" fill="#FFFFFF" opacity="0.85" />
        <rect x="320" y="154" width="130" height="5" rx="2.5" fill="#00FFFF" />
        <circle cx="450" cy="156.5" r="5" fill="#FFFFFF" />
      </g>
    </g>
  </g>

  <rect x="310" y="200" width="200" height="45" rx="3" fill="#4E342E" filter="url(#shadow-soft)" />
  <rect x="320" y="210" width="80" height="25" rx="2" fill="#3E2723" />
  <rect x="410" y="210" width="80" height="25" rx="2" fill="#3E2723" />
  
  <ellipse id="console-reflection" cx="410" cy="202" rx="100" ry="8" fill="url(#tv-backlight-glow)" opacity="0" filter="url(#glow-spread)" />
  </g>

  <!-- === FOREGROUND MOVIE ROUTINE PEDESTAL === -->
  <g id="routine-pedestal" filter="url(#shadow-soft)">
    <rect x="48" y="458" width="88" height="18" rx="4" fill="#455A64" />
    <rect x="118" y="458" width="18" height="18" rx="3" fill="#263238" opacity="0.65" />
    <rect x="40" y="451" width="104" height="18" rx="5" fill="#607D8B" />
    <rect x="10" y="466" width="160" height="28" rx="8" fill="#37474F" />
    <rect x="24" y="466" width="132" height="7" rx="3.5" fill="#607D8B" opacity="0.55" />
  </g>

  <!-- Enlarged MDI movie target mounted at the top of the pedestal -->
  <g id="mdi-wall-switch" transform="translate(56.4, 376.8) scale(1.6)" filter="url(#shadow-soft)">
    <rect x="0" y="0" width="42" height="54" rx="6" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2" />
    <rect x="4" y="4" width="34" height="46" rx="4" fill="#FFFFFF" />
    <path id="mdi-switch-indicator" fill="#37474F" stroke="none" transform="translate(9, 12) scale(1)"
          d="M19,4 H5 C3.89,4 3,4.89 3,6 V18 C3,19.1 3.9,20 5,20 H19 C20.1,20 21,19.1 21,18 V6 C21,4.89 20.1,4 19,4 Z M9.5,16.5 V7.5 L16.5,12 L9.5,16.5 Z M19,8 H17 V6 H19 V8 Z M15,8 H13 V6 H15 V8 Z M11,8 H9 V6 H11 V8 Z M7,8 H5 V6 H7 V8 Z" />
  </g>

  <!-- === FIRST PERSON PERSPECTIVE: BARE ARM HOLDING THE PHONE === -->
  <g id="first-person-arm" filter="url(#shadow-deep)">
    <!-- Forearm extending from bottom center -->
    <path d="M 230,500 L 210,360 L 320,350 L 350,500 Z" fill="#4F2F23" />

    <!-- Hand &amp; Palm Base -->
    <path d="M 210,360 C 200,320 230,290 270,300 C 300,308 320,330 320,350 Z" fill="#4F2F23" />

    <!-- SMARTPHONE (OFF STATE, GLOW LIGHT ACTIVE) -->
    <g id="smartphone" transform="translate(180, 190) rotate(-12)">
      <!-- Phone Outer Body -->
      <rect x="0" y="0" width="85" height="160" rx="14" fill="#212121" stroke="#424242" stroke-width="3" />
      
      <!-- Screen OFF Glass -->
      <rect x="4" y="6" width="77" height="148" rx="10" fill="#0A0A0A" />

      <!-- Tap confirmation displayed briefly after contact -->
      <g id="phone-checkmark" opacity="0" filter="url(#phone-check-glow)">
        <circle cx="42.5" cy="80" r="23" fill="#0D1B2A" stroke="#29B6F6" stroke-width="2.5" />
        <path d="M 29,80 L 38,89 L 57,69" fill="none" stroke="#29B6F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Active Tap Indicator Light at Top Bezel -->
      <circle id="phone-tap-light" cx="42" cy="4" r="16" fill="url(#phone-glow-grad)" opacity="0" />
    </g>

    <!-- Hand Fingers &amp; Corrected Natural Thumb Position -->
    <g id="hand-fingers">
      <!-- Side Grip Fingers Wrapping Phone Base -->
      <rect x="172" y="230" width="16" height="22" rx="7" fill="#4F2F23" transform="rotate(-12 172 230)" />
      <rect x="180" y="258" width="16" height="22" rx="7" fill="#4F2F23" transform="rotate(-12 180 258)" />
      <rect x="188" y="286" width="16" height="22" rx="7" fill="#4F2F23" transform="rotate(-12 188 286)" />
      <rect x="196" y="314" width="15" height="20" rx="7" fill="#4F2F23" transform="rotate(-12 196 314)" />

      <!-- Thumb emerging from the palm and wrapping around the phone edge -->
      <path d="M 298,330 C 287,315 278,298 272,282 C 268,272 271,261 279,257 C 287,253 295,260 294,269 C 293,278 287,286 289,295 C 291,305 300,314 306,321 Z" fill="#4F2F23" />
    </g>
  </g>
  </g>
</svg>

