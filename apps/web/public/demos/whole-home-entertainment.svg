<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <title>Whole-home audio and television-synced lighting</title>
  <desc>Music travels to speakers in three rooms while coloured lights behind a television follow the picture.</desc>
  <defs>
    <clipPath id="entertainment-scene"><rect width="600" height="500" rx="28" /></clipPath>
    <filter id="tv-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14" /></filter>
    <filter id="pulse-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="screen-picture" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d9ff"/><stop offset=".48" stop-color="#7669ff"/><stop offset="1" stop-color="#f25d9c"/></linearGradient>
  </defs>
  <style>
    .screen-picture { animation: screen-scene 8s ease-in-out infinite; }
    .tv-aura { animation: aura-scene 8s ease-in-out infinite; }
    .led-left { animation: led-left 8s ease-in-out infinite; }
    .led-right { animation: led-right 8s ease-in-out infinite; }
    .sound-ring { fill:none; stroke:#7cecff; stroke-width:5; opacity:0; transform-box:fill-box; transform-origin:center; animation:sound-ring 2.4s ease-out infinite; }
    .sound-ring.delay-one { animation-delay:.8s; }
    .sound-ring.delay-two { animation-delay:1.6s; }
    .music-note { fill:#b7f5ff; opacity:0; animation:note-rise 3.2s ease-in-out infinite; }
    .note-two { animation-delay:1.1s; }
    .note-three { animation-delay:2.2s; }
    .data-pulse { fill:#73e6ff; filter:url(#pulse-glow); offset-path:path('M300 402 L300 338 L121 338 L121 146 M300 338 L478 338 L478 146 M300 338 L300 178'); animation:data-flow 3.6s linear infinite; }
    .data-pulse.two { animation-delay:1.2s; }
    .data-pulse.three { animation-delay:2.4s; }
    @keyframes sound-ring { 0%{opacity:.9;transform:scale(.2)} 70%{opacity:.2} 100%{opacity:0;transform:scale(1.5)} }
    @keyframes note-rise { 0%,12%{opacity:0;transform:translateY(10px)} 25%,70%{opacity:1} 100%{opacity:0;transform:translateY(-32px)} }
    @keyframes data-flow { from{offset-distance:0%} to{offset-distance:100%} }
    @keyframes screen-scene { 0%,100%{fill:#00d9ff} 28%{fill:#7669ff} 55%{fill:#f25d9c} 78%{fill:#ffad4d} }
    @keyframes aura-scene { 0%,100%{fill:#00d9ff;opacity:.28} 28%{fill:#7669ff;opacity:.34} 55%{fill:#f25d9c;opacity:.35} 78%{fill:#ffad4d;opacity:.3} }
    @keyframes led-left { 0%,100%{stroke:#00d9ff} 28%{stroke:#7669ff} 55%{stroke:#f25d9c} 78%{stroke:#ffad4d} }
    @keyframes led-right { 0%,100%{stroke:#7669ff} 28%{stroke:#f25d9c} 55%{stroke:#ffad4d} 78%{stroke:#00d9ff} }
  </style>
  <g clip-path="url(#entertainment-scene)">
    <rect width="600" height="500" fill="#111827"/>
    <rect x="34" y="34" width="532" height="432" rx="24" fill="#1b2432" stroke="#516175" stroke-width="5"/>
    <path d="M206 36V254M394 36V254M36 254H564" fill="none" stroke="#465567" stroke-width="5"/>
    <path d="M300 402V338H121V146M300 338H478V146M300 338V178" fill="none" stroke="#31485b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(121 139)">
      <rect x="-22" y="-35" width="44" height="70" rx="10" fill="#2e3948" stroke="#7d8fa3" stroke-width="4"/>
      <circle r="12" fill="#111827" stroke="#73e6ff" stroke-width="4"/>
      <circle class="sound-ring" r="24"/><circle class="sound-ring delay-one" r="24"/><circle class="sound-ring delay-two" r="24"/>
      <path class="music-note" d="M35-3v-29l24-5v29c0 8-13 10-13 1 0-6 7-9 11-7v-13l-18 4v20c0 8-13 10-13 1 0-6 5-9 9-8z"/>
    </g>
    <g transform="translate(478 139)">
      <rect x="-22" y="-35" width="44" height="70" rx="10" fill="#2e3948" stroke="#7d8fa3" stroke-width="4"/>
      <circle r="12" fill="#111827" stroke="#73e6ff" stroke-width="4"/>
      <circle class="sound-ring" r="24"/><circle class="sound-ring delay-one" r="24"/><circle class="sound-ring delay-two" r="24"/>
      <path class="music-note note-two" d="M35-3v-29l24-5v29c0 8-13 10-13 1 0-6 7-9 11-7v-13l-18 4v20c0 8-13 10-13 1 0-6 5-9 9-8z"/>
    </g>
    <g transform="translate(300 171)">
      <rect x="-22" y="-35" width="44" height="70" rx="10" fill="#2e3948" stroke="#7d8fa3" stroke-width="4"/>
      <circle r="12" fill="#111827" stroke="#73e6ff" stroke-width="4"/>
      <circle class="sound-ring" r="24"/><circle class="sound-ring delay-one" r="24"/><circle class="sound-ring delay-two" r="24"/>
      <path class="music-note note-three" d="M35-3v-29l24-5v29c0 8-13 10-13 1 0-6 7-9 11-7v-13l-18 4v20c0 8-13 10-13 1 0-6 5-9 9-8z"/>
    </g>

    <circle class="data-pulse" r="7"/><circle class="data-pulse two" r="7"/><circle class="data-pulse three" r="7"/>

    <rect class="tv-aura" x="155" y="267" width="290" height="158" rx="24" filter="url(#tv-glow)"/>
    <rect x="171" y="278" width="258" height="132" rx="12" fill="#0a0d15" stroke="#8997aa" stroke-width="5"/>
    <rect class="screen-picture" x="184" y="291" width="232" height="106" rx="5" fill="url(#screen-picture)"/>
    <path d="M184 362L245 315L294 350L346 309L416 365V397H184Z" fill="#152237" opacity=".82"/>
    <circle cx="342" cy="322" r="17" fill="#ffe3a1" opacity=".9"/>
    <path class="led-left" d="M171 289V399" fill="none" stroke="#00d9ff" stroke-width="9" stroke-linecap="round"/>
    <path class="led-right" d="M429 289V399" fill="none" stroke="#7669ff" stroke-width="9" stroke-linecap="round"/>
    <path d="M276 411V430M324 411V430M256 431H344" fill="none" stroke="#78889b" stroke-width="7" stroke-linecap="round"/>
    <rect x="246" y="438" width="108" height="12" rx="6" fill="#28384a"/>
    <circle cx="300" cy="444" r="5" fill="#73e6ff"/>
  </g>
</svg>
