<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <title>Private baby monitoring and notifications</title>
  <desc>A nursery monitor detects sound and sends a helpful alert to a nearby phone.</desc>
  <defs>
    <clipPath id="baby-scene"><rect width="600" height="500" rx="28"/></clipPath>
    <filter id="baby-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="nursery-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#273449"/><stop offset="1" stop-color="#192330"/></linearGradient>
  </defs>
  <style>
    .sleep-z { fill:#a9c8ff; font:bold 22px sans-serif; opacity:0; animation:sleep 9s ease-in-out infinite; }
    .z-two { animation-delay:.55s; }.z-three { animation-delay:1.1s; }
    .cry-wave { fill:none; stroke:#ff9bbd; stroke-width:5; stroke-linecap:round; opacity:0; animation:cry 9s ease-out infinite; }
    .cry-two { animation-delay:.16s; }.cry-three { animation-delay:.32s; }
    .monitor-led { animation:monitor-led 9s linear infinite; }
    .signal-pulse { fill:#73e6ff; filter:url(#baby-glow); offset-path:path('M420 128 C365 110 315 132 285 194 C259 248 222 292 151 330'); animation:signal 9s ease-in-out infinite; opacity:0; }
    .phone { transform-box:fill-box; transform-origin:center; animation:phone-buzz 9s ease-in-out infinite; }
    .notification { opacity:0; transform-box:fill-box; transform-origin:center; animation:notification 9s ease-in-out infinite; }
    .camera-head { transform-box:fill-box; transform-origin:70% 70%; animation:camera-look 9s ease-in-out infinite; }
    @keyframes sleep { 0%,20%{opacity:0;transform:translateY(8px)} 27%,43%{opacity:.9} 48%,100%{opacity:0;transform:translateY(-20px)} }
    @keyframes cry { 0%,44%{opacity:0;transform:scale(.65)} 48%,57%{opacity:1;transform:scale(1)} 62%,100%{opacity:0;transform:scale(1.2)} }
    @keyframes monitor-led { 0%,44%,72%,100%{fill:#57d58a} 48%,68%{fill:#ff668f} }
    @keyframes signal { 0%,50%{opacity:0;offset-distance:0%} 53%{opacity:1} 66%{opacity:1;offset-distance:100%} 69%,100%{opacity:0;offset-distance:100%} }
    @keyframes phone-buzz { 0%,64%,75%,100%{transform:translateX(0) rotate(0)} 66%{transform:translateX(-4px) rotate(-1deg)} 68%{transform:translateX(4px) rotate(1deg)} 70%{transform:translateX(-3px) rotate(-1deg)} 72%{transform:translateX(3px) rotate(1deg)} }
    @keyframes notification { 0%,64%{opacity:0;transform:translateY(18px) scale(.94)} 69%,86%{opacity:1;transform:translateY(0) scale(1)} 94%,100%{opacity:0} }
    @keyframes camera-look { 0%,42%,100%{transform:rotate(-5deg)} 52%,78%{transform:rotate(8deg)} }
  </style>
  <g clip-path="url(#baby-scene)">
    <rect width="600" height="500" fill="#101724"/>
    <rect x="34" y="34" width="532" height="432" rx="24" fill="url(#nursery-wall)" stroke="#536276" stroke-width="5"/>
    <path d="M36 386H564" stroke="#536276" stroke-width="5"/>
    <circle cx="93" cy="97" r="36" fill="#ffda7d" opacity=".14"/>
    <path d="M84 94a24 24 0 1 0 30-30 27 27 0 1 1-30 30z" fill="#ffe6a6" opacity=".75"/>
    <circle cx="177" cy="97" r="3" fill="#cfe0ff"/><circle cx="215" cy="132" r="4" fill="#cfe0ff"/><circle cx="147" cy="151" r="3" fill="#cfe0ff"/>

    <g class="camera-head">
      <path d="M442 93L470 68" stroke="#8495aa" stroke-width="10" stroke-linecap="round"/>
      <circle cx="443" cy="94" r="10" fill="#f59842"/>
      <path d="M382 82h55l24 17-24 23h-55z" fill="#66788d" stroke="#a2b1c1" stroke-width="4"/>
      <circle cx="399" cy="101" r="12" fill="#111827" stroke="#73e6ff" stroke-width="4"/>
      <circle class="monitor-led" cx="436" cy="101" r="5" fill="#57d58a"/>
    </g>
    <path d="M420 128 C365 110 315 132 285 194 C259 248 222 292 151 330" fill="none" stroke="#334b60" stroke-width="4" stroke-dasharray="8 11"/>
    <circle class="signal-pulse" r="8"/>

    <g>
      <rect x="286" y="260" width="236" height="128" rx="12" fill="#38485a" stroke="#8495aa" stroke-width="5"/>
      <path d="M301 277V375M350 277V375M399 277V375M448 277V375M497 277V375" stroke="#77899d" stroke-width="7"/>
      <rect x="306" y="326" width="196" height="46" rx="20" fill="#aeb9d7"/>
      <circle cx="414" cy="318" r="27" fill="#996b50"/>
      <path d="M393 313q21-22 42 0" fill="#493228"/>
      <circle cx="405" cy="320" r="2.5" fill="#2e221d"/><circle cx="423" cy="320" r="2.5" fill="#2e221d"/>
      <path d="M407 331q8 5 15 0" fill="none" stroke="#6d3f3d" stroke-width="3" stroke-linecap="round"/>
      <text class="sleep-z" x="447" y="288">z</text><text class="sleep-z z-two" x="466" y="266">z</text><text class="sleep-z z-three" x="489" y="242">Z</text>
      <path class="cry-wave" d="M445 310q23-20 46 0"/><path class="cry-wave cry-two" d="M452 293q31-29 62 0"/><path class="cry-wave cry-three" d="M461 274q38-37 76 0"/>
    </g>

    <g class="phone">
      <rect x="73" y="270" width="151" height="202" rx="23" fill="#111722" stroke="#9aabbd" stroke-width="6"/>
      <rect x="86" y="292" width="125" height="155" rx="8" fill="#202d3e"/>
      <rect x="126" y="279" width="45" height="5" rx="3" fill="#74869a"/>
      <circle cx="149" cy="459" r="7" fill="#596a7d"/>
      <g class="notification">
        <rect x="96" y="316" width="105" height="91" rx="12" fill="#f5f1e8"/>
        <circle cx="118" cy="343" r="12" fill="#f25d9c"/>
        <path d="M113 343h10M118 338v10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="137" y="340" fill="#151b28" font-family="sans-serif" font-size="10" font-weight="700">Nursery</text>
        <text x="137" y="354" fill="#526070" font-family="sans-serif" font-size="8">Sound detected</text>
        <rect x="107" y="371" width="79" height="5" rx="3" fill="#d4d8dd"/>
        <rect x="107" y="383" width="55" height="5" rx="3" fill="#d4d8dd"/>
      </g>
    </g>
  </g>
</svg>
